# upsbridge Docker 版 —— 在 docker/ 目录下：
#   docker compose up -d
services:
  upsbridge:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: upsbridge:1.2.0
    container_name: upsbridge
    restart: unless-stopped
    ports:
      - "28190:28190"
    volumes:
      # 配置 config.json 与日志 log/ 都落在宿主 ./data/，重建容器不丢
      - ./data:/data
    # 关机要从容器里 nsenter 进宿主 PID 1 执行 shutdown，两者缺一不可：
    #   pid: host     -> 容器能看见宿主的 1 号进程
    #   privileged    -> 允许 nsenter 切换宿主命名空间
    pid: host
    privileged: true
    environment:
      # 与 Dockerfile 内一致，写在这里是为了让改法一眼可见
      - UPSBRIDGE_SHUTDOWN_CMD=nsenter -t 1 -m -u -i -n -p -- /sbin/shutdown -h now
