# NAS-2（secondary）—— 只监测远程 UPS，不接 USB
# 目标位置：/etc/nut/upsmon.conf
#
# <UPS_HOST>  替换为接了 UPS 的那台机器的地址
# <UPS_NAME>  上游 upsd 里的 UPS 标识（绿联 ups0 / 群晖 ups / 飞牛 ups）
# <USER> <PASS> 上游 upsd.users 里 upsmon 用户的账号密码
RUN_AS_USER nut

MONITOR <UPS_NAME>@<UPS_HOST> 1 <USER> <PASS> secondary
MINSUPPLIES 1

SHUTDOWNCMD "/sbin/shutdown -h +0"

POLLFREQ 5
POLLFREQALERT 5
HOSTSYNC 60
DEADTIME 15
MAXRETRY 3
MAXAGE 15

# secondary 收到 LB / FSD 立刻关机，别磨蹭
FINALDELAY 0

NOTIFYCMD /usr/sbin/upssched
