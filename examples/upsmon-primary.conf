# NAS-1（primary）—— UPS 的 USB 口接在这台
# 目标位置：/etc/nut/upsmon.conf
# 本机自检用 localhost，账号密码取自 upsd.users
RUN_AS_USER nut

MONITOR <UPS_NAME>@localhost 1 <USER> <PASS> primary
MINSUPPLIES 1

SHUTDOWNCMD "/usr/local/sbin/ups-shutdown.sh"

POWERDOWNFLAG /run/nut/powerdown

POLLFREQ 5
POLLFREQALERT 5
# 等 secondary 断开；必须 > secondary 的 FINALDELAY
HOSTSYNC 90
DEADTIME 15
MAXRETRY 3
MAXAGE 15
# 通知后等 45s 再真正关机
FINALDELAY 45

NOTIFYCMD /usr/sbin/upssched
